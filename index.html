<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BorderGuard AI — Ministry of Home Affairs | AI-Assisted Border Identity &amp; Document Screening</title>
  
  <!-- Modern System & Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Operations Console Stylesheet -->
  <link rel="stylesheet" href="css/borderguard.css" />
</head>
<body>
  <!-- Main Application Mount Point -->
  <div id="app"></div>

  <!-- Bootstrapping Script (ES Modules) -->
  <script type="module">
    import { BorderGuardApp } from './js/app.js';
    
    window.addEventListener('DOMContentLoaded', () => {
      const app = new BorderGuardApp();
      window.borderGuardApp = app;
      app.init();
    });
  </script>
</body>
</html>
